<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись к мастеру</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #f8f3ed 0%, #fef9f3 100%);
            color: #2a2a2a;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            padding: 20px 16px;
            padding-bottom: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ЗАГОЛОВОК С УСЛУГОЙ */
        .service-header {
            background: linear-gradient(135deg, #fef5f0 0%, #fff8f3 100%);
            border: 2px solid #f4e4d7;
            border-radius: 20px;
            padding: 24px 20px;
            margin-bottom: 28px;
            text-align: center;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }

        .service-icon {
            font-size: 48px;
            margin-bottom: 12px;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.1));
        }

        .service-title {
            font-size: 22px;
            font-weight: 700;
            color: #2a2a2a;
            margin-bottom: 6px;
            letter-spacing: -0.3px;
        }

        .service-subtitle {
            font-size: 14px;
            color: #8a8a8a;
            font-weight: 500;
        }

        /* СЕКЦИЯ */
        .section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: #6a6a6a;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* ВЫБОР ДАТЫ */
        .date-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .date-scroll::-webkit-scrollbar {
            display: none;
        }

        .date-chip {
            min-width: 90px;
            padding: 16px 12px;
            background: white;
            border: 2px solid #e8e8e8;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .date-chip:active {
            transform: scale(0.96);
        }

        .date-chip .date-day {
            font-size: 11px;
            color: #999;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .date-chip .date-num {
            font-size: 18px;
            font-weight: 700;
            color: #2a2a2a;
        }

        .date-chip.selected {
            background: linear-gradient(135deg, #d4a574 0%, #c89563 100%);
            border-color: #c89563;
            box-shadow: 0 4px 14px rgba(200, 149, 99, 0.35);
        }

        .date-chip.selected .date-day {
            color: rgba(255, 255, 255, 0.9);
        }

        .date-chip.selected .date-num {
            color: white;
        }

        /* ВЫБОР ВРЕМЕНИ */
        .time-picker {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .time-picker.active {
            display: block;
        }

        .time-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .time-chip {
            padding: 14px 10px;
            background: white;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            color: #2a2a2a;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .time-chip:active {
            transform: scale(0.96);
        }

        .time-chip.selected {
            background: linear-gradient(135deg, #d4a574 0%, #c89563 100%);
            border-color: #c89563;
            color: white;
            box-shadow: 0 4px 14px rgba(200, 149, 99, 0.35);
        }

        .time-chip.taken {
            background: #f5f5f5 !important;
            color: #bbb !important;
            border-color: #e0e0e0 !important;
            pointer-events: none;
            opacity: 0.6 !important;
            box-shadow: none !important;
        }

        /* ФОРМА КОНТАКТОВ */
        .contact-form {
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .contact-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #6a6a6a;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-field {
            width: 100%;
            padding: 14px 16px;
            border-radius: 12px;
            border: 2px solid #e8e8e8;
            background: white;
            color: #2a2a2a;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .input-field::placeholder {
            color: #bbb;
        }

        .input-field:focus {
            outline: none;
            border-color: #d4a574;
            box-shadow: 0 4px 14px rgba(212, 165, 116, 0.2);
        }

        textarea.input-field {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        /* КНОПКА ОТПРАВКИ */
        .submit-btn {
            display: none; /* Скрываем HTML-кнопку, используем нативную MainButton */
        }

        /* ВЫБОР УСЛУГИ */
        .service-selector {
            display: none;
        }

        .service-selector.active {
            display: block;
        }

        /* КНОПКА НАЗАД */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 16px;
            background: white;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            color: #6a6a6a;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .back-btn:active {
            transform: scale(0.96);
        }

        .back-btn:hover {
            border-color: #d4a574;
            color: #2a2a2a;
        }

        .service-menu-title {
            font-size: 24px;
            font-weight: 700;
            color: #2a2a2a;
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .service-menu-grid {
            display: grid;
            gap: 12px;
        }

        .service-menu-item {
            background: white;
            border: 2px solid #e8e8e8;
            border-radius: 16px;
            padding: 20px 18px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .service-menu-item:active {
            transform: scale(0.98);
        }

        .service-menu-item:hover {
            border-color: #d4a574;
            box-shadow: 0 4px 14px rgba(212, 165, 116, 0.2);
        }

        .service-menu-item .service-icon {
            font-size: 32px;
            filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.1));
        }

        .service-menu-item .service-info {
            flex: 1;
        }

        .service-menu-item .service-name {
            font-size: 17px;
            font-weight: 600;
            color: #2a2a2a;
            margin-bottom: 2px;
        }

        .service-menu-item .service-price {
            font-size: 13px;
            color: #8a8a8a;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ЭКРАН ВЫБОРА УСЛУГИ (показывается при открытии через прямую кнопку) -->
        <div class="service-selector" id="serviceSelector">
            <h1 class="service-menu-title">Выберите услугу</h1>
            <div class="service-menu-grid">
                <div class="service-menu-item" onclick="selectServiceFromMenu('Маникюр')">
                    <span class="service-icon">💅</span>
                    <div class="service-info">
                        <div class="service-name">Маникюр</div>
                        <div class="service-price">от 1500 ₽</div>
                    </div>
                </div>
                <div class="service-menu-item" onclick="selectServiceFromMenu('Педикюр')">
                    <span class="service-icon">🦶</span>
                    <div class="service-info">
                        <div class="service-name">Педикюр</div>
                        <div class="service-price">от 2000 ₽</div>
                    </div>
                </div>
                <div class="service-menu-item" onclick="selectServiceFromMenu('Покрытие гель-лак')">
                    <span class="service-icon">✨</span>
                    <div class="service-info">
                        <div class="service-name">Покрытие гель-лак</div>
                        <div class="service-price">от 800 ₽</div>
                    </div>
                </div>
                <div class="service-menu-item" onclick="selectServiceFromMenu('Наращивание ногтей')">
                    <span class="service-icon">💎</span>
                    <div class="service-info">
                        <div class="service-name">Наращивание ногтей</div>
                        <div class="service-price">от 2500 ₽</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- КНОПКА НАЗАД -->
        <div id="backButtonContainer" style="display: none;">
            <button class="back-btn" onclick="backToMenu()">
                ⬅️ Назад к выбору услуги
            </button>
        </div>

        <!-- ЗАГОЛОВОК С УСЛУГОЙ -->
        <div class="service-header" id="mainServiceHeader">
            <div class="service-icon" id="serviceIcon">💅</div>
            <div class="service-title" id="serviceTitle">Загрузка...</div>
            <div class="service-subtitle">Выберите удобное время</div>
        </div>

        <!-- ВЫБОР ДАТЫ -->
        <div class="section" id="dateSection">
            <div class="section-title">Выберите дату</div>
            <div class="date-scroll" id="dateScroll"></div>
        </div>

        <!-- ВЫБОР ВРЕМЕНИ -->
        <div class="section time-picker" id="timePicker">
            <div class="section-title">Выберите время</div>
            <div class="time-grid" id="timeGrid">
                <div class="time-chip" onclick="selectTime('10:00', this)">10:00</div>
                <div class="time-chip" onclick="selectTime('11:00', this)">11:00</div>
                <div class="time-chip" onclick="selectTime('12:00', this)">12:00</div>
                <div class="time-chip" onclick="selectTime('13:00', this)">13:00</div>
                <div class="time-chip" onclick="selectTime('14:00', this)">14:00</div>
                <div class="time-chip" onclick="selectTime('15:00', this)">15:00</div>
                <div class="time-chip" onclick="selectTime('16:00', this)">16:00</div>
                <div class="time-chip" onclick="selectTime('17:00', this)">17:00</div>
                <div class="time-chip" onclick="selectTime('18:00', this)">18:00</div>
                <div class="time-chip" onclick="selectTime('19:00', this)">19:00</div>
                <div class="time-chip" onclick="selectTime('20:00', this)">20:00</div>
                <div class="time-chip" onclick="selectTime('21:00', this)">21:00</div>
            </div>
        </div>

        <!-- ФОРМА КОНТАКТОВ -->
        <div class="section contact-form" id="contactForm">
            <div class="section-title">Контактные данные</div>

            <div class="form-group">
                <label class="form-label" for="userName">Ваше имя</label>
                <input type="text" id="userName" class="input-field" placeholder="Например, Мария">
            </div>

            <div class="form-group">
                <label class="form-label" for="userPhone">Номер телефона</label>
                <input type="tel" id="userPhone" class="input-field" placeholder="+7 (999) 123-45-67">
            </div>

            <div class="form-group">
                <label class="form-label" for="userComment">Комментарий мастеру</label>
                <textarea id="userComment" class="input-field" placeholder="Напишите пожелания или особые запросы..."></textarea>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let selectedServiceName = "";
        let selectedTime = "";
        let selectedDate = "";

        // Настраиваем нативную кнопку Telegram
        tg.MainButton.setText("Записаться 💅");
        tg.MainButton.color = "#d4a574";
        tg.MainButton.textColor = "#FFFFFF";
        tg.MainButton.hide(); // Изначально скрыта

        // Обработчик нажатия на MainButton
        tg.MainButton.onClick(submitBooking);

        window.onload = function() {
            // Получаем название услуги из URL
            const urlParams = new URLSearchParams(window.location.search);
            selectedServiceName = urlParams.get('service');

            if (!selectedServiceName) {
                // Если услуга не передана (открыто через прямую кнопку) — показываем экран выбора
                document.getElementById('serviceSelector').classList.add('active');
                document.getElementById('mainServiceHeader').style.display = 'none';
                document.getElementById('dateSection').style.display = 'none';
                document.getElementById('timePicker').style.display = 'none';
                document.getElementById('contactForm').style.display = 'none';
            } else {
                // Услуга передана через URL (inline-кнопка)
                document.getElementById('serviceTitle').innerText = selectedServiceName;
                generateDateButtons();
            }
        };

        function selectServiceFromMenu(serviceName) {
            selectedServiceName = serviceName;

            // Скрываем экран выбора услуги
            document.getElementById('serviceSelector').classList.remove('active');

            // Показываем основной интерфейс
            document.getElementById('backButtonContainer').style.display = 'block';
            document.getElementById('mainServiceHeader').style.display = 'block';
            document.getElementById('dateSection').style.display = 'block';

            document.getElementById('serviceTitle').innerText = serviceName;

            generateDateButtons();
        }

        function backToMenu() {
            // Скрываем основной интерфейс
            document.getElementById('backButtonContainer').style.display = 'none';
            document.getElementById('mainServiceHeader').style.display = 'none';
            document.getElementById('dateSection').style.display = 'none';
            document.getElementById('timePicker').style.display = 'none';
            document.getElementById('timePicker').classList.remove('active');

            const contactForm = document.getElementById('contactForm');
            contactForm.style.display = 'none';
            contactForm.classList.remove('active');

            // Очищаем выбранные данные
            selectedServiceName = "";
            selectedDate = "";
            selectedTime = "";

            // Убираем классы selected
            document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('selected'));
            document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('selected'));

            // Очищаем сгенерированные даты
            document.getElementById('dateScroll').innerHTML = '';

            // Очищаем поля формы
            document.getElementById('userName').value = '';
            document.getElementById('userPhone').value = '';
            document.getElementById('userComment').value = '';

            // Скрываем MainButton
            tg.MainButton.hide();

            // Показываем экран выбора услуги
            document.getElementById('serviceSelector').classList.add('active');
        }

        function generateDateButtons() {
            const dateScroll = document.getElementById('dateScroll');
            if (!dateScroll) return;

            const today = new Date();
            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

            for (let i = 0; i < 7; i++) {
                const date = new Date(today);
                date.setDate(today.getDate() + i);

                const dayName = i === 0 ? 'Сегодня' : days[date.getDay()];
                const dayNum = date.getDate() + ' ' + months[date.getMonth()];
                const dateStr = date.getFullYear() + '-' +
                    String(date.getMonth() + 1).padStart(2, '0') + '-' +
                    String(date.getDate()).padStart(2, '0');

                const chip = document.createElement('div');
                chip.className = 'date-chip' + (i === 0 ? ' selected' : '');
                chip.innerHTML = `<div class="date-day">${dayName}</div><div class="date-num">${dayNum}</div>`;
                chip.onclick = () => selectDate(dateStr, chip);
                dateScroll.appendChild(chip);
            }

            // Автоматически выбираем сегодня
            const todayStr = today.getFullYear() + '-' +
                String(today.getMonth() + 1).padStart(2, '0') + '-' +
                String(today.getDate()).padStart(2, '0');
            selectedDate = todayStr;

            // Загружаем доступность слотов
            updateTimeAvailability();
        }

        function selectDate(dateStr, element) {
            selectedDate = dateStr;
            document.querySelectorAll('.date-chip').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');

            // Сбрасываем выбор времени и формы
            selectedTime = "";
            document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('selected'));
            document.getElementById('contactForm').classList.remove('active');

            // Скрываем кнопку отправки
            tg.MainButton.hide();

            // Показываем timePicker принудительно
            const timePicker = document.getElementById('timePicker');
            timePicker.style.display = 'block';
            timePicker.classList.add('active');

            // Обновляем доступность времени
            updateTimeAvailability();

            // Плавно прокручиваем к выбору времени
            setTimeout(() => {
                timePicker.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 150);
        }

        function updateTimeAvailability() {
            if (!selectedDate || !selectedServiceName) return;

            const timePicker = document.getElementById('timePicker');
            timePicker.classList.add('active');

            // Запрос к /api/availability для получения занятых слотов
            fetch(`/api/availability?date=${selectedDate}&service=${encodeURIComponent(selectedServiceName)}`)
                .then(response => response.json())
                .then(data => {
                    const takenTimes = data.takenSlots || [];

                    document.querySelectorAll('.time-chip').forEach(chip => {
                        const time = chip.innerText.trim();
                        chip.classList.remove('taken', 'selected');

                        if (takenTimes.includes(time)) {
                            chip.classList.add('taken');
                        }
                    });
                })
                .catch(err => {
                    console.error("Ошибка получения доступности:", err);
                });
        }

        function selectTime(time, element) {
            // Проверяем, не занят ли слот
            if (element.classList.contains('taken')) return;

            selectedTime = time.trim();
            document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('selected'));
            element.classList.add('selected');

            // Показываем форму принудительно
            const contactForm = document.getElementById('contactForm');
            contactForm.style.display = 'block';
            contactForm.classList.add('active');

            // Показываем нативную кнопку Telegram
            tg.MainButton.show();

            // Плавно прокручиваем к форме
            setTimeout(() => {
                contactForm.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 150);
        }

        function submitBooking() {
            const nameEl = document.getElementById('userName');
            const phoneEl = document.getElementById('userPhone');
            const commentEl = document.getElementById('userComment');

            const name = nameEl ? nameEl.value.trim() : "";
            const phone = phoneEl ? phoneEl.value.trim() : "";
            const comment = commentEl ? commentEl.value.trim() : "";

            if (!name || !phone) {
                tg.showAlert("Пожалуйста, заполните имя и телефон!");
                return;
            }

            if (!selectedTime || !selectedDate) {
                tg.showAlert("Выберите дату и время!");
                return;
            }

            if (!selectedServiceName) {
                tg.showAlert("Ошибка: услуга не выбрана!");
                return;
            }

            // Получаем данные пользователя из Telegram WebApp
            const user = tg.initDataUnsafe?.user;
            if (!user || !user.id) {
                tg.showAlert("Ошибка: не удалось получить данные пользователя из Telegram!");
                return;
            }

            // Показываем индикатор загрузки
            tg.MainButton.showProgress();

            // Формируем данные для отправки
            const bookingData = {
                serviceName: selectedServiceName,
                date: selectedDate,
                time: selectedTime,
                userId: user.id,
                name: name,
                phone: phone,
                comment: comment,
                initData: tg.initData || ""
            };

            // Отправляем AJAX-запрос на сервер
            fetch('/api/book', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bookingData)
            })
            .then(response => {
                if (!response.ok) {
                    return response.text().then(text => {
                        throw new Error(text || 'Ошибка сервера');
                    });
                }
                return response.json();
            })
            .then(data => {
                // Успешная запись
                tg.MainButton.hideProgress();

                if (data.status === 'pending_confirmation') {
                    // Запись требует подтверждения (есть существующая запись)
                    tg.showAlert("Проверьте Telegram - требуется подтверждение замены записи");
                } else {
                    // Запись подтверждена
                    tg.showAlert("Запись успешно создана! ✅");
                }

                // Закрываем WebApp
                setTimeout(() => {
                    tg.close();
                }, 500);
            })
            .catch(error => {
                console.error('Ошибка при записи:', error);
                tg.MainButton.hideProgress();
                tg.showAlert("Ошибка при записи: " + error.message);
            });
        }
    </script>
</body>
</html>
